<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>romzo chat example</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  fieldset { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 1rem; }
  label { display: block; margin: 0.5rem 0 0.25rem; font-size: 0.9rem; }
  input { width: 100%; box-sizing: border-box; padding: 0.4rem; }
  button { padding: 0.4rem 0.9rem; margin-top: 0.5rem; }
  #log { list-style: none; padding: 0; border: 1px solid #ccc; border-radius: 6px; min-height: 8rem; max-height: 16rem; overflow-y: auto; }
  #log li { padding: 0.25rem 0.6rem; border-bottom: 1px solid #eee; font-size: 0.9rem; word-break: break-all; }
  #status { font-size: 0.85rem; color: #666; }
  #invite { font-size: 0.85rem; word-break: break-all; }
</style>
<script type="importmap">
  { "imports": { "romzo": "../../packages/romzo-client/dist/index.js" } }
</script>
</head>
<body>
  <h1>romzo chat example</h1>
  <p id="status">disconnected</p>

  <fieldset>
    <legend>Create a room (host)</legend>
    <label>Relay origin, e.g. http://127.0.0.1:9224
      <input id="origin" autocomplete="off" placeholder="http://127.0.0.1:9224">
    </label>
    <label>Creation password (only if the relay requires one)
      <input id="password" type="password" autocomplete="off">
    </label>
    <button id="create">Create room</button>
    <p id="invite"></p>
  </fieldset>

  <fieldset>
    <legend>Join a room (guest)</legend>
    <label>Room code
      <input id="code" autocomplete="off" placeholder="ABCD2345EF">
    </label>
    <button id="join">Join room</button>
  </fieldset>

  <ul id="log"></ul>
  <form id="compose">
    <input id="message" autocomplete="off" placeholder="type a message and press Enter">
  </form>

  <script type="module" src="./app.js"></script>
</body>
</html>
