<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Romzo · 节点状态</title><meta name="description" content="Romzo relay operator console."><link rel="icon" type="image/svg+xml" href="../romzo-icon.svg"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><div class="bar">
<a class="wordmark" href="../"><img src="../romzo-icon.svg" width="26" height="26" alt="" aria-hidden="true">Romzo</a>
<span class="console-title" data-i18n="title">节点状态</span>
<button id="language" type="button">English</button>
</div></header>
<main>
<form id="login"><label for="key" data-i18n="key">访问密钥</label><div class="login-row"><input id="key" type="password" required maxlength="256" autocomplete="off" spellcheck="false"><button class="primary" data-i18n="connect">查看</button></div></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="dashboard" hidden aria-label="Metrics"><div class="toolbar"><span><span data-i18n="updated">最后更新</span> <time id="updated">—</time></span><div class="actions"><button id="refresh" data-i18n="refresh">立即刷新</button><button id="pause" data-i18n="pause">暂停刷新</button><button id="logout" data-i18n="logout">退出</button></div></div>
<dl class="cards"><div><dt data-i18n="rooms">房间</dt><dd id="rooms">—</dd></div><div><dt data-i18n="connections">连接</dt><dd id="connections">—</dd></div><div><dt data-i18n="unauthenticated">未认证连接</dt><dd id="unauthenticated">—</dd></div><div><dt data-i18n="queueBytes">队列占用</dt><dd id="queueBytes">—</dd></div><div><dt data-i18n="inRate">入站速率</dt><dd id="inRate">—</dd></div><div><dt data-i18n="outRate">出站入队速率</dt><dd id="outRate">—</dd></div></dl>
<section class="history"><div class="history-head"><h2 data-i18n="roomRecords">房间记录</h2><span id="history-mode" class="muted"></span></div><div class="history-controls"><div><button id="traffic-tab" aria-pressed="true" data-i18n="trafficTop">流量 Top 10</button><button id="online-tab" aria-pressed="false" data-i18n="onlineTop">在线 Top 10</button></div><span id="room-limits" class="muted"></span></div><div class="table-scroll" tabindex="0"><table><thead><tr><th data-i18n="roomId">编号</th><th data-i18n="creatorIP">创建 IP</th><th data-i18n="traffic">流量</th><th data-i18n="onlineTime">在线</th><th data-i18n="connections">连接</th><th data-i18n="state">状态</th><th></th></tr></thead><tbody id="room-records"></tbody></table></div></section>
<h2 data-i18n="counters">累计计数</h2><dl class="rows"><div><dt data-i18n="receivedBytes">入站字节</dt><dd id="receivedBytes">—</dd></div><div><dt data-i18n="sentBytes">出站入队字节</dt><dd id="sentBytes">—</dd></div><div><dt data-i18n="receivedFrames">入站帧</dt><dd id="receivedFrames">—</dd></div><div><dt data-i18n="sentFrames">出站入队帧</dt><dd id="sentFrames">—</dd></div><div><dt data-i18n="queueRejected">队列拒绝次数</dt><dd id="queueRejected">—</dd></div></dl>
<h2 data-i18n="reasons">连接关闭原因</h2><ul id="reasons"></ul><details><summary data-i18n="semanticsLabel">统计口径</summary><p class="muted" data-i18n="semantics">计数随进程重启清零。入站统计认证后的帧，出站按入队统计。字节数不含传输开销。</p></details></section>
</main></body></html>
