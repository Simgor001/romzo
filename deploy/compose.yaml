services:
  relay:
    image: ghcr.io/simgor001/romzo:${ROMZO_VERSION:-v1.6.0}
    env_file: .env
    environment:
      LISTEN: :9224
    ports:
      - "127.0.0.1:9224:9224"
    restart: unless-stopped
    read_only: true
    # Writable mount for METRICS_HISTORY_FILE and MEMBER_STATE_FILE.
    # Set MEMBER_STATE_FILE=/data/members.json after draining old rooms.
    # Host dir must be writable by uid 65532 (the container user).
    volumes:
      - /opt/romzo/data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 2
    pids_limit: 128
