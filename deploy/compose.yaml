services:
  relay:
    image: ghcr.io/simgor001/romzo:${ROMZO_VERSION:-v1.3.0}
    env_file: .env
    environment:
      LISTEN: :9224
    ports:
      - "127.0.0.1:9224:9224"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 2
    pids_limit: 128
