name: Retag latest
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to promote to latest'
        required: true
permissions:
  contents: read
  packages: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Copy the release tag to latest
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect "$repo:${{ inputs.tag }}" >/dev/null
          docker buildx imagetools create --tag "$repo:latest" "$repo:${{ inputs.tag }}"
