components:
    securitySchemes:
        MetricsKey:
            type: http
            scheme: bearer
            description: Independent persistent METRICS_KEY; endpoint disabled when unset.
    schemas:
        AdmissionRequest:
            properties:
                key:
                    pattern: ^[0-9a-f]{64}$
                    type: string
            required:
                - key
            type: object
        AdmissionResponse:
            properties:
                admission:
                    $ref: '#/components/schemas/SignedTicket'
            required:
                - admission
            type: object
        AllocationBody:
            description: proof is the HMAC over the request with the password-derived verifier and is required when the server announces auth=password; turnstile is a Cloudflare Turnstile token and is required when the server announces turnstile=true. Idempotent replays with the same requestId return the original descriptor without re-verifying either.
            properties:
                proof:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                request:
                    $ref: '#/components/schemas/AllocationRequest'
                turnstile:
                    type: string
            required:
                - request
            type: object
        AllocationRequest:
            properties:
                capability:
                    pattern: ^[0-9a-f]{32}$
                    type: string
                challenge:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                configHash:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                host:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                options:
                    $ref: '#/components/schemas/Options'
                origin:
                    type: string
                protocol:
                    enum:
                        - romzo/v1
                    type: string
                requestId:
                    pattern: ^[0-9a-f]{32}$
                    type: string
                transport:
                    pattern: ^[0-9a-f]{64}$
                    type: string
            required:
                - protocol
                - origin
                - challenge
                - requestId
                - host
                - transport
                - capability
                - configHash
                - options
            type: object
        ChallengeResponse:
            properties:
                challenge:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                expires:
                    format: int64
                    type: integer
            required:
                - challenge
                - expires
            type: object
        Descriptor:
            properties:
                capability:
                    pattern: ^[0-9a-f]{32}$
                    type: string
                code:
                    pattern: ^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{10}$
                    type: string
                configHash:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                host:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                instance:
                    pattern: ^[0-9a-f]{32}$
                    type: string
                options:
                    $ref: '#/components/schemas/Options'
                origin:
                    type: string
                protocol:
                    enum:
                        - romzo/v1
                    type: string
                transport:
                    pattern: ^[0-9a-f]{64}$
                    type: string
            required:
                - protocol
                - origin
                - code
                - instance
                - host
                - transport
                - capability
                - configHash
                - options
            type: object
        Discovery:
            properties:
                algorithm:
                    enum:
                        - PBKDF2-HMAC-SHA256
                    type: string
                auth:
                    enum:
                        - password
                        - anonymous
                        - "off"
                    type: string
                iterations:
                    format: int32
                    type: integer
                limits:
                    properties:
                        bytesPerSecond:
                            format: int32
                            type: integer
                        framesPerSecond:
                            format: int32
                            type: integer
                    required:
                        - framesPerSecond
                        - bytesPerSecond
                    type: object
                origin:
                    type: string
                protocol:
                    enum:
                        - romzo/v1
                    type: string
                salt:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                turnstile:
                    type: boolean
                version:
                    type: string
            required:
                - protocol
                - version
                - origin
                - auth
                - salt
                - iterations
                - algorithm
                - turnstile
                - limits
            type: object
        Error:
            properties:
                error:
                    type: string
            required:
                - error
            type: object
        RoomRecord:
            properties:
                code:
                    type: string
                creatorIP:
                    type: string
                active:
                    type: boolean
                channels:
                    format: int32
                    type: integer
                connections:
                    format: int32
                    type: integer
                endedAt:
                    format: int64
                    type: integer
                id:
                    pattern: ^[0-9a-f]{24}$
                    type: string
                observedAt:
                    format: int64
                    type: integer
                onlineSeconds:
                    format: int64
                    type: integer
                receivedBytes:
                    format: int64
                    type: integer
                sentBytes:
                    format: int64
                    type: integer
                stopReason:
                    type: string
            type: object
        RoomHistory:
            properties:
                nodeOutboundBytesPerSecond:
                    format: int32
                    type: integer
                maxBytes:
                    format: int64
                    type: integer
                maxSeconds:
                    format: int32
                    type: integer
                onlineTop:
                    items:
                        $ref: '#/components/schemas/RoomRecord'
                    maxItems: 10
                    type: array
                persistent:
                    type: boolean
                trafficTop:
                    items:
                        $ref: '#/components/schemas/RoomRecord'
                    maxItems: 10
                    type: array
                writeError:
                    type: boolean
            type: object
        Metrics:
            properties:
                roomHistory:
                    $ref: '#/components/schemas/RoomHistory'
                closedReasons:
                    additionalProperties:
                        format: int64
                        type: integer
                    type: object
                connections:
                    format: int32
                    type: integer
                queueBytes:
                    format: int64
                    type: integer
                queueRejected:
                    format: int64
                    type: integer
                receivedBytes:
                    format: int64
                    type: integer
                receivedFrames:
                    format: int64
                    type: integer
                rooms:
                    format: int32
                    type: integer
                sentBytes:
                    format: int64
                    type: integer
                sentFrames:
                    format: int64
                    type: integer
                unauthenticated:
                    format: int32
                    type: integer
            type: object
        Options:
            description: Opaque canonical JSON, at most MAX_OPTIONS_BYTES UTF-8 bytes (default and maximum 4096). Safe integers only; application rules are validated by clients. Any JSON root type is permitted. An object value may declare the room's channels under "channels" — up to 8 entries of {"name": "table", "maxFrameBytes": 262144} with unique names matching ^[a-z][a-z0-9-]{0,31}$ and limits between 256 and 262144 bytes; a malformed declaration fails allocation with invalid_allocation. Options without "channels" have no channels; null declarations are invalid; see FRAMES.md.
            nullable: true
        Ready:
            properties:
                ready:
                    type: boolean
            required:
                - ready
            type: object
        RestoreBody:
            properties:
                recovery:
                    $ref: '#/components/schemas/SignedTicket'
                signature:
                    pattern: ^[0-9a-f]{128}$
                    type: string
                signed:
                    $ref: '#/components/schemas/SignedDescriptor'
            required:
                - signed
                - recovery
                - signature
            type: object
        SignedDescriptor:
            properties:
                descriptor:
                    $ref: '#/components/schemas/Descriptor'
                signature:
                    pattern: ^[0-9a-f]{128}$
                    type: string
            required:
                - descriptor
                - signature
            type: object
        SignedTicket:
            properties:
                signature:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                ticket:
                    $ref: '#/components/schemas/Ticket'
            required:
                - ticket
                - signature
            type: object
        Ticket:
            properties:
                code:
                    pattern: ^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{10}$
                    type: string
                digest:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                expires:
                    format: int64
                    type: integer
                instance:
                    pattern: ^[0-9a-f]{32}$
                    type: string
                key:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                nonce:
                    pattern: ^[0-9a-f]{32}$
                    type: string
                origin:
                    type: string
                protocol:
                    enum:
                        - romzo/v1
                    type: string
                purpose:
                    enum:
                        - creator
                        - guest
                        - recovery
                    type: string
            required:
                - protocol
                - origin
                - code
                - instance
                - digest
                - key
                - purpose
                - expires
                - nonce
            type: object
        TicketPair:
            properties:
                admission:
                    $ref: '#/components/schemas/SignedTicket'
                recovery:
                    $ref: '#/components/schemas/SignedTicket'
            required:
                - admission
                - recovery
            type: object
info:
    description: Room allocation and encrypted fan-out relay for the romzo/v1 protocol. The server forwards client-signed envelopes verbatim; it holds no game rules, keys, or state beyond room lifecycles. All requests reject query strings; browser origins are checked against the server allowlist; every route is per-IP rate limited.
    title: Romzo Relay
    version: 1.3.1
openapi: 3.0.3
paths:
    /api/v1/admin/rooms/stop:
        post:
            description: Requires METRICS_KEY. Disconnects every peer and rejects currently valid restore tickets. Not an IP ban. A save failure reports 500 after the room has stopped; restart durability then is not guaranteed.
            requestBody:
                content:
                    application/json:
                        schema:
                            additionalProperties: false
                            properties:
                                id:
                                    pattern: ^[0-9a-f]{24}$
                                    type: string
                            required:
                                - id
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json: {}
                    description: Room stopped.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid request.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid management key.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Disabled or unknown room.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Management rate limit.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: History save failed.
            security:
                - MetricsKey: []
            summary: Stop a room
    /.well-known/romzo:
        get:
            description: 'Public parameters a client needs before allocating a room: PBKDF2 salt for password-derived proofs, whether creation requires a password proof and/or a Cloudflare Turnstile token, and relay rate limits.'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Discovery'
                    description: Discovery document.
            summary: Relay discovery document
    /api/v1/metrics:
        get:
            description: Aggregate snapshot; requires METRICS_KEY in the Authorization Bearer header, even on loopback. Disabled when the key is unset. Counters accumulate since process startup.
            security:
                - MetricsKey: []
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Metrics'
                    description: Metrics snapshot.
                "401":
                    description: Missing or invalid metrics key.
                "404":
                    description: Metrics endpoint disabled.
                "429":
                    description: Per-IP token bucket exhausted.
            summary: Operational metrics
    /api/v1/room-challenges:
        post:
            description: Every room allocation must reference a fresh challenge, consumed by the allocation attempt (including failed password proofs). Challenges expire after 30 seconds.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChallengeResponse'
                    description: Fresh challenge.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Per-IP token bucket exhausted.
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Challenge store full.
            summary: Mint a single-use creation challenge
    /api/v1/rooms:
        post:
            description: Creates an unconfirmed room reservation. Optionally enforces a Cloudflare Turnstile token and/or a password proof, both checked only at this step; the reservation itself must be confirmed by the host via the confirm endpoint before peers can join.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AllocationBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Descriptor'
                    description: Room descriptor for the new reservation; identical replays of the same requestId return the same descriptor.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Malformed request body.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Challenge missing/expired or password proof rejected.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Origin not allowlisted, Turnstile token missing or rejected.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: requestId already used with a different request.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Per-IP token bucket exhausted.
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Room capacity reached.
            summary: Allocate a room
    /api/v1/rooms/{code}:
        get:
            parameters:
                - in: path
                  name: code
                  required: true
                  schema:
                    pattern: ^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{10}
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SignedDescriptor'
                    description: Signed descriptor as confirmed by the host.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unknown or unconfirmed room.
            summary: Fetch the confirmed room descriptor
    /api/v1/rooms/{code}/admissions:
        post:
            description: Anyone holding a confirmed room code can mint a 60-second admission ticket for a peer Ed25519 public key; possession of the private key is proven inside the WebSocket handshake.
            parameters:
                - in: path
                  name: code
                  required: true
                  schema:
                    pattern: ^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{10}
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AdmissionRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdmissionResponse'
                    description: Guest admission ticket.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Malformed key.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unknown or unconfirmed room.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Per-IP token bucket exhausted.
            summary: Mint a guest admission ticket
    /api/v1/rooms/{code}/confirm:
        post:
            description: The host posts the descriptor signed with its Ed25519 host key, proving control of the room identity. Returns a short-lived admission ticket for the WebSocket handshake and a recovery ticket bound to the current lease.
            parameters:
                - in: path
                  name: code
                  required: true
                  schema:
                    pattern: ^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{10}
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SignedDescriptor'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketPair'
                    description: Admission and recovery tickets.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Descriptor mismatch or invalid host signature.
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Reservation or lease expired.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Per-IP token bucket exhausted.
            summary: Confirm a reservation and receive tickets
    /api/v1/rooms/{code}/restore:
        post:
            description: Reinstates the room instance bound to an unexpired recovery ticket signed by the ticket key holder. Replays cannot extend the original lease.
            parameters:
                - in: path
                  name: code
                  required: true
                  schema:
                    pattern: ^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{10}
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RestoreBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdmissionResponse'
                    description: Fresh admission ticket.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Recovery ticket, digest, or signature invalid.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Room identity conflict.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Per-IP token bucket exhausted.
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Room capacity reached.
            summary: Restore a room after relay restart
    /ws:
        get:
            description: Upgrades to a WebSocket carrying romzo/v1 text frames. The handshake is authenticate (admission ticket) then proof (Ed25519 signature over the server challenge). Authenticated frames are subscribe, unsubscribe, send, and keepalive on the channels declared in the room options (no channels when undeclared); the relay only routes envelopes and never inspects payload contents. This document describes the HTTP surface; frame-level semantics live in the protocol vectors.
            responses:
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Connection capacity reached.
            summary: WebSocket relay endpoint
    /healthz:
        get:
            description: Returns 200 while the process serves requests. Unauthenticated and unrate-limited.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ready'
                    description: Service is up.
            summary: Liveness/readiness probe
    /readyz:
        get:
            description: Returns 200 while the process serves requests. Unauthenticated and unrate-limited.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ready'
                    description: Service is up.
            summary: Liveness/readiness probe
servers:
    - url: /
