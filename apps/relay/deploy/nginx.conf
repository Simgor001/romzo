# These declarations belong in the http block. Do not log bodies or query credentials.
limit_conn_zone $binary_remote_addr zone=ru_connections:10m;
limit_req_zone $binary_remote_addr zone=ru_requests:10m rate=10r/s;
map $http_upgrade $ru_connection { default upgrade; '' close; }

server {
    listen 443 ssl;
    server_name relay.example.com;
    ssl_certificate /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    client_max_body_size 16k;
    limit_conn ru_connections 32;
    limit_req zone=ru_requests burst=32 nodelay;
    access_log off;

    location = /.well-known/relic-undertow { proxy_pass http://127.0.0.1:8080; }
    location /_relic/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ru_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
    location / { return 404; }
}
